<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2波源干渉縞シミュレーター</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #05050f; }
  canvas { cursor: grab; }
  canvas:active { cursor: grabbing; }
  input[type=range] { accent-color: #60a5fa; }
</style>
</head>
<body class="min-h-screen text-white flex flex-col items-center py-6 px-4">
  <h1 class="text-2xl font-bold mb-1 text-blue-400">2波源 干渉縞 リアルタイム Canvas シミュレーター</h1>
  <p class="text-sm text-gray-400 mb-4">2つの波源からの波の重ね合わせ ｜ 波源をドラッグして位置変更</p>

  <div class="flex flex-col lg:flex-row gap-6 items-start justify-center w-full max-w-5xl">
    <div class="flex flex-col items-center gap-3">
      <canvas id="canvas" width="500" height="400" class="border border-gray-800 rounded-xl shadow-2xl"></canvas>
      <div class="flex gap-3 flex-wrap justify-center">
        <button id="btnToggle" class="px-5 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg font-semibold transition-colors">停止</button>
        <button id="btnReset" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg font-semibold transition-colors text-sm">位置リセット</button>
      </div>
      <div class="flex gap-4 text-xs text-gray-500">
        <span class="flex items-center gap-1"><span class="inline-block w-3 h-3 rounded-full bg-yellow-400"></span>波源1（ドラッグ可）</span>
        <span class="flex items-center gap-1"><span class="inline-block w-3 h-3 rounded-full bg-cyan-400"></span>波源2（ドラッグ可）</span>
      </div>
    </div>

    <div class="bg-gray-900 border border-gray-700 rounded-xl p-5 w-full max-w-sm">
      <h2 class="text-lg font-semibold text-blue-300 mb-4">波のパラメータ</h2>

      <div class="space-y-4">
        <div>
          <label class="text-sm text-gray-300 flex justify-between mb-1">
            <span>波長 λ</span>
            <span id="valWavelength" class="text-blue-400 font-mono">60</span><span class="text-xs text-gray-500">px</span>
          </label>
          <input type="range" id="sliderWavelength" min="20" max="150" value="60" class="w-full">
        </div>

        <div>
          <label class="text-sm text-gray-300 flex justify-between mb-1">
            <span>振幅 A</span>
            <span id="valAmplitude" class="text-blue-400 font-mono">1.0</span>
          </label>
          <input type="range" id="sliderAmplitude" min="1" max="20" value="10" class="w-full">
        </div>

        <div>
          <label class="text-sm text-gray-300 flex justify-between mb-1">
            <span>角振動数 ω</span>
            <span id="valOmega" class="text-blue-400 font-mono">1.0</span>
          </label>
          <input type="range" id="sliderOmega" min="1" max="30" value="10" class="w-full">
          <div class="flex justify-between text-xs text-gray-600 mt-1"><span>遅い</span><span>速い</span></div>
        </div>

        <div>
          <label class="text-sm text-gray-300 flex justify-between mb-1">
            <span>位相差 Δφ</span>
            <span id="valPhase" class="text-blue-400 font-mono">0.0</span><span class="text-xs text-gray-500">π</span>
          </label>
          <input type="range" id="sliderPhase" min="0" max="40" value="0" class="w-full">
          <div class="flex justify-between text-xs text-gray-600 mt-1"><span>0</span><span>2π</span></div>
        </div>

        <div>
          <label class="text-sm text-gray-300 flex justify-between mb-1">
            <span>カラーモード</span>
          </label>
          <select id="selectColor" class="w-full px-3 py-2 rounded-lg text-sm bg-gray-800 border border-gray-600 text-white">
            <option value="blue-red">青（正）/ 赤（負）</option>
            <option value="heatmap">ヒートマップ</option>
            <option value="grayscale">グレースケール</option>
            <option value="plasma">プラズマ</option>
          </select>
        </div>
      </div>

      <div class="mt-5 border-t border-gray-700 pt-4">
        <h3 class="text-sm font-semibold text-gray-400 mb-2">波源の位置</h3>
        <div class="grid grid-cols-2 gap-2 text-xs text-center">
          <div class="bg-gray-800 rounded p-2">
            <div class="text-yellow-400 font-semibold mb-1">波源 1</div>
            <div>x: <span id="s1x" class="font-mono">150</span> y: <span id="s1y" class="font-mono">200</span></div>
          </div>
          <div class="bg-gray-800 rounded p-2">
            <div class="text-cyan-400 font-semibold mb-1">波源 2</div>
            <div>x: <span id="s2x" class="font-mono">350</span> y: <span id="s2y" class="font-mono">200</span></div>
          </div>
        </div>
      </div>

      <div class="mt-4 border-t border-gray-700 pt-4 text-xs text-gray-500 space-y-1">
        <p>各ピクセルでの合成振幅: <span class="text-blue-300">A·sin(k·r₁-ω·t) + A·sin(k·r₂-ω·t+Δφ)</span></p>
        <p>k = 2π/λ（波数）、r = 波源からの距離</p>
        <p>強め合い（明帯）: 経路差 = nλ</p>
        <p>弱め合い（暗帯）: 経路差 = (n+½)λ</p>
      </div>
    </div>
  </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let wavelength = 60;
let amplitude = 1.0;
let omega = 1.0;
let phaseDiff = 0.0;
let colorMode = 'blue-red';
let running = true;
let t = 0;

let sources = [
  { x: 150, y: 200 },
  { x: 350, y: 200 }
];

const imageData = ctx.createImageData(W, H);
const pixels = imageData.data;

// Pre-compute distance maps for efficiency
let distMap1 = new Float32Array(W * H);
let distMap2 = new Float32Array(W * H);

function computeDistMaps() {
  const s1 = sources[0], s2 = sources[1];
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = y * W + x;
      distMap1[i] = Math.sqrt((x - s1.x) ** 2 + (y - s1.y) ** 2);
      distMap2[i] = Math.sqrt((x - s2.x) ** 2 + (y - s2.y) ** 2);
    }
  }
}

function colorFromValue(v, maxV) {
  const norm = v / maxV; // -1 to 1
  let r, g, b;
  if (colorMode === 'blue-red') {
    if (norm >= 0) { r = 0; g = Math.floor(norm * 100); b = Math.floor(norm * 255); }
    else { r = Math.floor(-norm * 255); g = 0; b = Math.floor(-norm * 100); }
  } else if (colorMode === 'heatmap') {
    const n = (norm + 1) / 2;
    r = Math.floor(Math.max(0, Math.min(255, n < 0.5 ? 0 : (n - 0.5) * 510)));
    g = Math.floor(Math.max(0, Math.min(255, n < 0.25 ? n * 510 : n < 0.75 ? 127 + (0.5 - n) * 100 : 0)));
    b = Math.floor(Math.max(0, Math.min(255, n < 0.5 ? (0.5 - n) * 510 : 0)));
  } else if (colorMode === 'grayscale') {
    const val = Math.floor(((norm + 1) / 2) * 255);
    r = g = b = val;
  } else if (colorMode === 'plasma') {
    const n = (norm + 1) / 2;
    r = Math.floor(Math.sin(n * Math.PI) * 200 + 55);
    g = Math.floor(Math.sin(n * Math.PI + Math.PI * 2 / 3) * 100 + 55);
    b = Math.floor(Math.abs(Math.cos(n * Math.PI * 2)) * 200 + 55);
  }
  return { r, g, b };
}

function render() {
  const k = (2 * Math.PI) / wavelength;
  const maxAmp = 2 * amplitude;

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = y * W + x;
      const r1 = distMap1[i];
      const r2 = distMap2[i];
      const v1 = amplitude * Math.sin(k * r1 - omega * t);
      const v2 = amplitude * Math.sin(k * r2 - omega * t + phaseDiff);
      const val = v1 + v2;

      const { r, g, b } = colorFromValue(val, maxAmp);
      const pi = i * 4;
      pixels[pi]     = r;
      pixels[pi + 1] = g;
      pixels[pi + 2] = b;
      pixels[pi + 3] = 255;
    }
  }

  ctx.putImageData(imageData, 0, 0);

  // Draw sources
  sources.forEach((s, idx) => {
    ctx.beginPath();
    ctx.arc(s.x, s.y, 8, 0, Math.PI * 2);
    ctx.fillStyle = idx === 0 ? '#facc15' : '#22d3ee';
    ctx.fill();
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = 'black';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(idx + 1, s.x, s.y);
  });
}

function loop() {
  if (running) {
    t += 0.05;
    render();
    requestAnimationFrame(loop);
  }
}

// Drag handling
let dragging = null;
function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

canvas.addEventListener('mousedown', e => {
  const pos = getCanvasPos(e);
  for (let i = 0; i < sources.length; i++) {
    const s = sources[i];
    if (Math.sqrt((pos.x - s.x) ** 2 + (pos.y - s.y) ** 2) < 15) {
      dragging = i;
      return;
    }
  }
});
canvas.addEventListener('mousemove', e => {
  if (dragging === null) return;
  const pos = getCanvasPos(e);
  sources[dragging].x = Math.max(0, Math.min(W, pos.x));
  sources[dragging].y = Math.max(0, Math.min(H, pos.y));
  computeDistMaps();
  updateSourceDisplay();
});
canvas.addEventListener('mouseup', () => { dragging = null; });
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const pos = getCanvasPos(e);
  for (let i = 0; i < sources.length; i++) {
    const s = sources[i];
    if (Math.sqrt((pos.x - s.x) ** 2 + (pos.y - s.y) ** 2) < 20) {
      dragging = i; return;
    }
  }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (dragging === null) return;
  const pos = getCanvasPos(e);
  sources[dragging].x = Math.max(0, Math.min(W, pos.x));
  sources[dragging].y = Math.max(0, Math.min(H, pos.y));
  computeDistMaps();
  updateSourceDisplay();
}, { passive: false });
canvas.addEventListener('touchend', () => { dragging = null; });

function updateSourceDisplay() {
  document.getElementById('s1x').textContent = Math.round(sources[0].x);
  document.getElementById('s1y').textContent = Math.round(sources[0].y);
  document.getElementById('s2x').textContent = Math.round(sources[1].x);
  document.getElementById('s2y').textContent = Math.round(sources[1].y);
}

document.getElementById('btnToggle').addEventListener('click', () => {
  running = !running;
  document.getElementById('btnToggle').textContent = running ? '停止' : '再生';
  if (running) loop();
});
document.getElementById('btnReset').addEventListener('click', () => {
  sources[0] = { x: 150, y: 200 };
  sources[1] = { x: 350, y: 200 };
  computeDistMaps();
  updateSourceDisplay();
});

function bindSlider(id, valId, setter, transform = v => v, decimals = 1) {
  const el = document.getElementById(id);
  el.addEventListener('input', () => {
    const v = transform(parseFloat(el.value));
    document.getElementById(valId).textContent = Number.isInteger(v) ? v : v.toFixed(decimals);
    setter(v);
  });
}

bindSlider('sliderWavelength', 'valWavelength', v => { wavelength = v; }, parseInt, 0);
bindSlider('sliderAmplitude', 'valAmplitude', v => { amplitude = v; }, v => v / 10);
bindSlider('sliderOmega', 'valOmega', v => { omega = v; }, v => v / 10);
bindSlider('sliderPhase', 'valPhase', v => { phaseDiff = v * Math.PI / 20; }, v => (v / 20).toFixed(1));

document.getElementById('selectColor').addEventListener('change', e => {
  colorMode = e.target.value;
});

computeDistMaps();
updateSourceDisplay();
loop();
</script>
</body>
</html>
